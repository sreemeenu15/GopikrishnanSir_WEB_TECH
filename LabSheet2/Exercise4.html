<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .form-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
        }

        button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }

        button:hover {
            background: #5568d3;
        }

        .clear-btn {
            background: #e74c3c;
        }

        .clear-btn:hover {
            background: #c0392b;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .delete-btn {
            padding: 8px 15px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .no-users {
            text-align: center;
            padding: 30px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>User Management System</h1>

        <div class="form-section">
            <h2>User Registration</h2>
            <form id="userForm">
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="name" required>
                    <div class="error" id="nameError"></div>
                </div>

                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" required>
                    <div class="error" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label>Mobile Number *</label>
                    <input type="tel" id="mobile" required>
                    <div class="error" id="mobileError"></div>
                </div>

                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="password" required>
                    <div class="error" id="passwordError"></div>
                </div>

                <button type="submit">Register User</button>
            </form>
        </div>

        <div class="form-section">
            <h2>Registered Users</h2>
            <button class="clear-btn" id="clearAllBtn">Clear All Users</button>
            <div id="userTable"></div>
        </div>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('users')) || [];

        const form = document.getElementById('userForm');
        const clearAllBtn = document.getElementById('clearAllBtn');

        // Load users on page load
        displayUsers();

        // Form submit
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const password = document.getElementById('password').value;

            // Clear errors
            clearErrors();

            // Validation
            let valid = true;

            if (name === '') {
                showError('nameError', 'Name is required');
                valid = false;
            }

            if (email === '') {
                showError('emailError', 'Email is required');
                valid = false;
            } else if (users.some(user => user.email === email)) {
                showError('emailError', 'Email already registered');
                valid = false;
            }

            if (mobile === '') {
                showError('mobileError', 'Mobile number is required');
                valid = false;
            } else if (mobile.length !== 10 || !/^\d+$/.test(mobile)) {
                showError('mobileError', 'Mobile number must be 10 digits');
                valid = false;
            }

            if (password === '') {
                showError('passwordError', 'Password is required');
                valid = false;
            } else if (password.length < 6) {
                showError('passwordError', 'Password must be minimum 6 characters');
                valid = false;
            }

            if (!valid) return;

            // Add user
            const user = { name, email, mobile, password };
            users.push(user);
            localStorage.setItem('users', JSON.stringify(users));

            // Reset form
            form.reset();
            displayUsers();
            alert('User registered successfully!');
        });

        // Clear all users
        clearAllBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to delete all users?')) {
                users = [];
                localStorage.removeItem('users');
                displayUsers();
            }
        });

        function displayUsers() {
            const tableDiv = document.getElementById('userTable');

            if (users.length === 0) {
                tableDiv.innerHTML = '<div class="no-users">No users registered yet</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            users.forEach((user, index) => {
                html += `
                    <tr>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.mobile}</td>
                        <td><button class="delete-btn" onclick="deleteUser(${index})">Delete</button></td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            tableDiv.innerHTML = html;
        }

        function deleteUser(index) {
            if (confirm('Are you sure you want to delete this user?')) {
                users.splice(index, 1);
                localStorage.setItem('users', JSON.stringify(users));
                displayUsers();
            }
        }

        function showError(id, message) {
            document.getElementById(id).textContent = message;
        }

        function clearErrors() {
            document.querySelectorAll('.error').forEach(el => el.textContent = '');
        }
    </script>
</body>
</html>
