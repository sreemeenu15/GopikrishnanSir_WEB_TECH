<style>
  :root { --grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
  body { font-family: 'Inter', sans-serif; background: #f0f2f5; padding: 40px; color: #2d3436; }
  .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
  
  /* Table Styling */
  table { width: 100%; border-collapse: collapse; margin-bottom: 40px; border-radius: 12px; overflow: hidden; }
  thead { background: var(--grad); color: white; }
  th, td { padding: 15px; text-align: left; border-bottom: 1px solid #edf2f7; }
  tr:hover { background: #f8fafc; }

  /* Form Styling */
  .form-group { margin-bottom: 15px; }
  input, textarea { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; outline: none; transition: 0.3s; }
  input:focus { border-color: #667eea; }
  button { background: var(--grad); color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: 600; }
</style>

<div class="container">
  <h2>Student Marksheet</h2>
  <table>
    <thead>
      <tr><th>Roll No</th><th>Name</th><th>S1</th><th>S2</th><th>S3</th><th>Total</th></tr>
    </thead>
    <tbody>
      <tr><td>101</td><td>Alice</td><td>85</td><td>90</td><td>88</td><td>263</td></tr>
      <tr><td>102</td><td>Bob</td><td>78</td><td>82</td><td>80</td><td>240</td></tr>
    </tbody>
  </table>

  <hr style="border: 0; height: 1px; background: #e2e8f0; margin: 40px 0;">

  <h2>Get in Touch</h2>
  <form id="contact-form">
    <div class="form-group"><label>Name</label><input type="text" required></div>
    <div class="form-group"><label>Email</label><input type="email" required></div>
    <div class="form-group"><label>Message</label><textarea rows="4"></textarea></div>
    <button type="submit">Send Message</button>
  </form>
</div>
