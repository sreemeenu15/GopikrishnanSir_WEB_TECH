<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Exercises</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
        }

        /* Exercise 4: Product Card */
        .product-card {
            width: 300px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 100%;
            border-radius: 8px;
        }

        .product-card h3 {
            margin: 15px 0 10px;
            color: #333;
        }

        .product-card p {
            color: #666;
            margin-bottom: 15px;
        }

        .product-card .price {
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
            margin: 15px 0;
        }

        .product-card button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .product-card button:hover {
            background: #5568d3;
        }
